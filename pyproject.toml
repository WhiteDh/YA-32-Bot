[tool.poetry]
name = "ya32-bot"
version = "1.1.0"
description = "Розклад групи ЯА-32 (КПІ) у Telegram: розклад, домашка, нагадування, синхронізація з schedule.kpi.ua."
authors = ["YA-32"]
readme = "README.md"
packages = [{ include = "ya32_bot", from = "src" }]

# ───────────────────────────────────────────────────────────────────────────
# Runtime dependencies
# ───────────────────────────────────────────────────────────────────────────
[tool.poetry.dependencies]
python = ">=3.13,<3.14"

# --- Telegram ---
aiogram = "^3.31"

# --- Config ---
pydantic = "^2.11"
pydantic-settings = "^2.15"

# --- Database: async ORM + migrations; Postgres in prod, SQLite in tests ---
sqlalchemy = { version = "^2.0.40", extras = ["asyncio"] }
alembic = "^1.20"
asyncpg = ">=0.31,<0.33"
aiosqlite = "^0.22"

# --- Scheduling (reminders, digests, KPI auto-sync) ---
apscheduler = "^3.11"

# --- HTTP (schedule sources) ---
httpx = "^0.28"

# --- Time zones: Windows has no system tz database ---
tzdata = "^2026.1"

# ───────────────────────────────────────────────────────────────────────────
# Development dependencies
# ───────────────────────────────────────────────────────────────────────────
[tool.poetry.group.dev.dependencies]
ruff = ">=0.16,<0.18"
mypy = "^2.4"
bandit = "^1.8"
pip-audit = "^2.9"
pytest = "^9.0"
pytest-asyncio = "^1.4"
pytest-cov = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ===========================================================================
# Tooling — one source of truth, run only through scripts/gate.py
# ===========================================================================

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["_temp", "_ideas"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # pathlib
    "DTZ",      # naive datetime is a bug here
    "ANN",      # annotations required
    "ARG",      # unused arguments
    "TID",      # tidy imports
    "RUF",      # ruff-specific
    "ASYNC",    # blocking calls in async code
]
ignore = [
    "ANN401",   # typing.Any where deliberate
    # User-facing copy is Ukrainian (Cyrillic): RUF001/2/3 flag Cyrillic letters as
    # look-alikes of Latin ones — by design here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests use naive local wall time on purpose — it is the frame lessons live in.
"tests/*" = ["ANN", "ARG", "DTZ"]
"migrations/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["ya32_bot"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/ya32_bot"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError", "if TYPE_CHECKING:"]

[tool.bandit]
exclude_dirs = ["tests"]
